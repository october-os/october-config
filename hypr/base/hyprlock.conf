source = ./colors.conf

background {
    path = screenshot
    blur_passes = 3
    blur_size = 3
}

label {
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb($foreground)
    font_size = 25
    font_family = Ubuntu Mono Nerd Font Propo
    position = 0, 350
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgb($foreground)
    font_size = 120
    font_family = Ubuntu Mono Nerd Font Propo
    position = 0, 250
    halign = center
    valign = center
}

image {
    path = $HOME/.config/october-config/profile_picture.jpg
    border_size = 2
    border_color = rgba(255, 255, 255, .65)
    size = 130
    position = 0, 40
    halign = center
    valign = center
}

shape {
    size = 300, 60
    color = rgba(255, 255, 255, 0)
    border_color = rgba(253, 198, 135, 0)
    position = 0, -140
    halign = center
    valign = center
}

label {
    text = $USER
    color = rgb($foreground)
    font_size = 18
    font_family = Ubuntu Mono Nerd Font Propo
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    size = 300, 60
    outline_thickness = 2
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba($foreground10)
    font_color = rgb($foreground)
    fade_on_empty = true
    placeholder_text =
    position = 0, -120
    halign = center
    valign = center
    check_color = rgba($color255)
    font_family = Ubuntu Mono Nerd Font Propo
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    fail_color = rgb($color2)
}
